name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Preserve upstream's protected-master workflow and runner policy.
    if: github.repository != 'everlastingcrown/paperclip'
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@master

  fork-release-ci:
    # Fork-only backport qualification uses commands from the exact release.
    # Its runner gate falls back to GitHub-hosted runners for this repository.
    if: github.repository == 'everlastingcrown/paperclip'
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@bba6a45f0d364cfd962ac59b3bdf2426a8222adb
